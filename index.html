<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C447C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>学习记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <span id="tb-title">时间轴</span>
    </div>
    <div class="tb-right">
      <span id="sync-dot" class="sync-dot" title="同步状态"></span>
      <span id="tb-sub"></span>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabbar">
    <button class="tab active" data-view="timeline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M12 7h6M12 12h9M12 17h6"/></svg>
      <span>时间轴</span>
    </button>
    <button class="tab" data-view="tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg>
      <span>任务</span>
    </button>
    <button class="tab" data-view="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 15l3-4 3 3 4-6"/></svg>
      <span>总览</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="js/core.js"></script>
<script src="js/github.js"></script>
<script src="js/sync.js"></script>
<script src="js/export.js"></script>
<script src="js/view-timeline.js"></script>
<script src="js/view-tasks.js"></script>
<script src="js/view-dashboard.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
